[project]
name = "claimguard-evals"
version = "0.1.0"
description = "Harbor evaluation suite for ClaimGuard's S01-S10 scenarios (docs/plan.md M7)."
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.23.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 200

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
