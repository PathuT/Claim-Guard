[project]
name = "claimguard-backend"
version = "0.1.0"
description = "ClaimGuard backend: Agno agents, AGT governance adapter, token service, data gateway, payments mock"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.0.0",
    "groq>=0.11.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt[crypto]>=2.9.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "arize-phoenix>=8.0.0",
    # arize-phoenix-otel's register() has a real version-skew bug against
    # the current arize-phoenix + opentelemetry-exporter-otlp-proto-http
    # (crashes reading exporter._headers, an attribute that no longer
    # exists — reproduced with a bare register() call, latest release
    # 0.17.1, no fix on PyPI as of M6). observability/tracing.py builds the
    # TracerProvider directly with opentelemetry-sdk instead of calling
    # register(); kept as a dependency in case a future release fixes it or
    # another module wants its helper classes, but nothing currently calls
    # phoenix.otel.register().
    "arize-phoenix-otel>=0.7.0",
    "openinference-instrumentation-agno>=0.1.0",
    "opentelemetry-sdk>=1.28.0",
    "python-dotenv>=1.0.0",
    "faker>=30.0.0",
    "reportlab>=4.2.0",
    "pypdf>=5.0.0",
    "agent-governance-toolkit[full]>=4.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Every run leaves a JUnit report; GET /system/facts shows its real counts.
addopts = "--junitxml=.reports/pytest.xml"
# rootdir is backend/, so `from auth import ...` / `from data_gateway import ...`
# resolve the same way they do for `uv run python -m <package>` elsewhere in
# this repo (see agents/hello_agent.py's docstring for the same import-mode note).
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# B008 ("no function calls in argument defaults") doesn't know about FastAPI's
# Depends()/Header()/Query() dependency-injection pattern, which relies
# exactly on that shape — every FastAPI route in this repo hits this
# false positive, so it's disabled repo-wide rather than noqa'd per line.
ignore = ["B008"]
