[project]
name = "claimguard-backend"
version = "0.1.0"
description = "ClaimGuard backend: Agno agents, AGT governance adapter, token service, data gateway, payments mock"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.0.0",
    "groq>=0.11.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt[crypto]>=2.9.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "arize-phoenix>=8.0.0",
    "arize-phoenix-otel>=0.7.0",
    "openinference-instrumentation-agno>=0.1.0",
    "opentelemetry-sdk>=1.28.0",
    "python-dotenv>=1.0.0",
    "faker>=30.0.0",
    "reportlab>=4.2.0",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
